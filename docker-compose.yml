services:
  backend:
    build: ./backend
    ports: ["8001:8001"]
    env_file: .env
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/ml/artifacts:/app/backend/ml/artifacts
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports: ["3000:80"]
    depends_on: [backend]
